[project]
name = "xirra"
version = "0.1.0"
description = "The team's Feishu assistant over the central xpisode store"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "lark-oapi>=1.4",
  "openai>=1.40",
]

[project.scripts]
xirra = "xirra.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xirra"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
