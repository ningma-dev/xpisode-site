# Station yam_3 with the left YAM leader replaced by an ABC GELLO (xpisode-abc-gello); everything
# else is robots/yam_3/station.toml. Start it instead of that file:
#
#     scripts/run.sh --file station_gello.toml --who NAME
#
# Differences from station.toml:
# - leader_l is the GELLO on its U2D2 (FTDI serial FTBPFNFF, motor IDs 10-16 at 2 Mbaud). It must
#   be in its calibration pose when the station starts: arm joints at the YAM's zero, trigger
#   released; a joint more than 15 deg off refuses to open and says which.
# - teleop_left is xpisode_abc_gello.teleop (../_shared/gello_left.toml): a takeover keeps the
#   follower where it is and closes the gap as the GELLO moves; the follower's grip is felt on
#   the trigger. The GELLO cannot be driven, so leader_left holds its trigger feedback, not a pose.
# - The GELLO has no buttons, so the right YAM leader's take both: button 0 switches both arms,
#   button 1 starts and ends a recording. The ready-pose grant has no button here.

station = "yam_3"
control_hz = 100
drain_ms = 1000
required_streams = [
  "/follower_l/state", "/follower_r/state", "/leader_l/input", "/leader_r/input",
  "/cam_head/frame", "/cam_left_wrist/frame", "/cam_right_wrist/frame",
]

[[devices]]
name = "follower_l"
exclusive = ["can:can_follower_l"]
command = ["../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
           "--factory", "xpisode_i2rt.xpisode:YamFollower", "--config", '{"channel": "can_follower_l", "tuned": "tuned/can_follower_l.json"}']

[[devices]]
name = "follower_r"
exclusive = ["can:can_follower_r"]
command = ["../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
           "--factory", "xpisode_i2rt.xpisode:YamFollower", "--config", '{"channel": "can_follower_r", "tuned": "tuned/can_follower_r.json"}']

[[devices]]
name = "leader_l"
exclusive = ["serial:FTBPFNFF"]
command = ["../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
           "--factory", "xpisode_abc_gello:GelloLeader", "--config", '{"device": "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBPFNFF-if00-port0", "servo_ids": [10, 11, 12, 13, 14, 15, 16]}']

[[devices]]
name = "leader_r"
exclusive = ["can:can_leader_r"]
command = ["../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
           "--factory", "xpisode_i2rt.xpisode:YamLeader", "--config", '{"channel": "can_leader_r", "rate_hz": 200, "encoder_every": 2}']

[[devices]]
name = "cam_head"
exclusive = ["realsense:262422270541"]
command = [
  "../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
  "--factory", "xpisode_realsense:D405", "--config",
  '{"serial": "262422270541", "frame_fields": ["color", "infrared_left", "infrared_right"], "width": 640, "height": 480, "fps": 30, "exposure_us": 32000}',
]

[[devices]]
name = "cam_left_wrist"
exclusive = ["realsense:262622270461"]
command = [
  "../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
  "--factory", "xpisode_realsense:D405", "--config",
  '{"serial": "262622270461", "frame_fields": ["color", "infrared_left", "infrared_right"], "width": 640, "height": 480, "fps": 30, "exposure_us": 32000}',
]

[[devices]]
name = "cam_right_wrist"
exclusive = ["realsense:262422270285"]
command = [
  "../../.venv/bin/python", "-m", "xpisode_device.cli", "run", "--station", "{station}", "--name", "{name}",
  "--factory", "xpisode_realsense:D405", "--config",
  '{"serial": "262422270285", "frame_fields": ["color", "infrared_left", "infrared_right"], "width": 640, "height": 480, "fps": 30, "exposure_us": 32000}',
]

[groups.left]
endpoints = ["follower_l/joint_position"]
holder = "teleop_left"

[groups.right]
endpoints = ["follower_r/joint_position"]
holder = "teleop_right"

# Each teleop client makes its leader follow the follower during policy control.
[groups.leader_left]
endpoints = ["leader_l/trigger_feedback"]
holder = "teleop_left"

[groups.leader_right]
endpoints = ["leader_r/joint_position"]
holder = "teleop_right"

# The buttons, all on the right YAM leader (the GELLO has none): button 0 switches both arms
# between the teleop clients and whoever had them before (a policy); button 1 starts and ends a
# recording, which gives the arms back to the teleop clients.
[[inputs]]
stream = "leader_r/input"
field = "buttons"
index = 0
operation = "switch"
groups = ["left", "right"]

[[inputs]]
stream = "leader_r/input"
field = "buttons"
index = 1
operation = "record"

[[clients]]
name = "teleop_left"
command = ["../../.venv/bin/python", "-m", "xpisode_abc_gello.teleop", "--station", "{station}", "--name", "{name}", "--config", "../_shared/gello_left.toml"]

[[clients]]
name = "teleop_right"
command = ["../../.venv/bin/python", "-m", "xpisode_env.teleop", "--station", "{station}", "--name", "{name}", "--config", "../_shared/teleop_right.toml"]

# Open-loop control: to a pose saved in poses.toml, or along a clip of an
# Episode, as its `target` prompt says; then it holds the arms there until button 0 switches
# them. Save a pose where the arms are with scripts/save_pose.sh NAME, the station running.
[[clients]]
name = "move"
command = ["../../.venv/bin/python", "-m", "xpisode_env.move", "--station", "{station}", "--name", "{name}", "--group", "left", "--group", "right"]

# Says out loud what blocks recording, a recording cut short, and quickcheck's alerts. It joins
# with no control groups, so a running one is adopted, never started twice.
[[clients]]
name = "announcer"
command = ["../../.venv/bin/python", "../../scripts/announcer.py", "--station", "{station}", "--name", "{name}"]

# Where the cameras and the right arm are (as on yam_abc; assumes yam_3 is built to the same
# i2rt station CAD -- confirm before relying on them): the station's CAD, as i2rt ships it
# in i2rt/robot_models/station/yam_station_linear_4310_d405 (v1.3.6), read off its URDF at full
# precision. Its left_base and {side}_gripper (the flange) are the declared models' base and
# gripper (checked: 1 um, 0.0004 deg apart at zero); its cameras are optical frames (+z forward).

[[transforms]]
parent = "follower_l/base"
child = "follower_r/base"
translation = [0, -0.61, 0]  # metres: x, y, z of the child in the parent
rotation = [0, 0, 0, 1]  # unit quaternion: x, y, z, w
source = "CAD: i2rt v1.3.6 yam_station_linear_4310_d405, left_base -> right_base"

[[transforms]]
parent = "follower_l/base"
child = "cam_head/color"
translation = [-0.16649488, -0.305, 0.95432053]  # metres: x, y, z of the child in the parent
rotation = [-0.68301167, 0.683014179, -0.183012208, 0.183011536]  # unit quaternion: x, y, z, w
source = "CAD: i2rt v1.3.6 yam_station_linear_4310_d405, left_base -> top_camera"

[[transforms]]
parent = "follower_l/gripper"
child = "cam_left_wrist/color"
translation = [-7.65679795e-08, -0.0704349787, 0.077005929]  # metres: x, y, z of the child in the parent
rotation = [-0.216444662, -1.79306714e-06, -3.97516236e-07, 0.976294888]  # unit quaternion: x, y, z, w
source = "CAD: i2rt v1.3.6 yam_station_linear_4310_d405, left_gripper -> left_camera"

[[transforms]]
parent = "follower_r/gripper"
child = "cam_right_wrist/color"
translation = [-7.65679795e-08, -0.0704349787, 0.077005929]  # metres: x, y, z of the child in the parent
rotation = [-0.216444662, -1.79306714e-06, -3.97516236e-07, 0.976294888]  # unit quaternion: x, y, z, w
source = "CAD: i2rt v1.3.6 yam_station_linear_4310_d405, right_gripper -> right_camera"
