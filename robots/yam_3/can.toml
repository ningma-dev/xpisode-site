# CAN adapter serial of each arm role on yam_3: the only source of the udev rule
# (host/can_rules.py). The channel names are the role names, can_<role>, the same on every YAM
# machine; only the serials differ. can_rules.py refuses while one is FILL or two are the same.
# A serial names the adapter, not the arm: label each adapter and its cable with the arm name and
# keep them together. Map them with docs/guides/identify-devices.md (unplug one at a time), never from
# port order.
# Plugged in (2026-11-13), all candleLight gs_usb 1d50:606f at 12M on xHCI 0000:0f:00.0:
#   208F3783454650062 (USB 3-4.1)   20833395594E50182 (USB 3-4.2)
#   20673463584550182 (USB 3-5.2)   20603463584550182 (USB 3-5.4)
# Which serial is which arm is NOT known yet.

follower_l = "FILL"
follower_r = "FILL"
leader_l = "FILL"
leader_r = "FILL"
